[package]
name = "lni_lexe_nodejs"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
lni = { path = "../../crates/lni", default-features = false, features = ["napi_rs"] }
napi = { version = "2.16", default-features = false, features = ["napi4", "tokio_rt", "async"] }
napi-derive = "2.16"
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[build-dependencies]
napi-build = "2.0.1"

[features]
# Offline lifecycle tests only; never enable in release builds.
lexe_monitor_test = []
