[package]
name = "lni_napi_rs"
edition = "2021"
version = "0.26.1"
license = "MPL-2.0"
publish = false

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "lni_napi_rs"

[dependencies]
lni = { path = "../../crates/lni", default-features = false, features = ["napi_rs"] }
async-trait = "0.1.92"
thiserror = "2.0.21"
serde = { version = "1.0.229", features=["derive"] }
serde_json = "1.0.154"
# Reuse the rustls provider selected by the LNI dependency graph.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "query", "rustls-no-provider", "blocking", "socks"] }
tokio = { version = "1.54.1", features = ["full"] }
napi = { version = "3.16.1", default-features = false, features = ["napi4", "tokio_rt", "async"] }
napi-derive = "3.7.0"
dotenv = "0.15.0"
lazy_static = "1.5.1"
bip39 = "3.0.0"
rand = "0.10.3"


[build-dependencies]
napi-build = "2.6.0"

[features]
napi_rs = []
default = ["napi_rs"]

