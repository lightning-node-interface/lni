[package]
name = "lni"
version = "0.1.0"
edition = "2021"

[lib]
name = "lni"
path = "lib.rs"
crate-type = ["staticlib", "cdylib", "lib"] # *comment this out for napi builds. this is a staticlib for iOS, cdylib for Android/uniffi bindgen, lib for Rust consumers, 

[dependencies]
# Lexe and NWC enable rustls/ring. Do not add a second provider through reqwest.
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
reqwest = { version = "0.13.5", default-features = false, features = [
    "json", "form", "query",
    "rustls-no-provider",
    "blocking",
    "socks",
] }
async-trait = "0.1.92"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The published React Native generator supports UniFFI 0.31.x without patches.
uniffi = { version = "0.31.2", features = ["tokio", "cli"], optional = true }
napi = { version = "3.16.1", default-features = false, features = ["napi4"], optional = true }
napi-derive = { version = "3.7.0", optional = true }
async-std = "1.13.2"
tokio = { version = "1.54.1", features = ["full"] }
dotenv = "0.15.0"
lazy_static = "1.5.1"
base64 = "0.23.1"
serde_urlencoded = "0.7.1"
rand = "0.10.3"
hex = "0.4.3"
sha2 = "0.11.1"
lightning-invoice = "0.34.1"
lexe = "0.1.27"
lexe-crypto = "0.1.27"
regex = "1.13.1"
json = "0.12.4"
uuid = { version = "1.29.0", features = ["v4"] }
nwc = "0.45.2"
nostr = "0.45.6"
chrono = { version = "0.4.45", features = ["serde"] }
once_cell = "1.21.4"
breez-sdk-spark = { git = "https://github.com/breez/spark-sdk", tag = "0.27.2", default-features = false, features = ["sqlite"] }
bip39 = "3.0.0"
bech32 = "0.12.0"
lexe-connect = { version = "0.1.27", default-features = false, features = ["crypto"] }

[dev-dependencies]
async-attributes = "1.1.2"
tokio = { version = "1.54.1", features = ["full"] }
uniffi = { version = "0.31.2", features = ["bindgen-tests"] }
bip39 = "3.0.0"
tempfile = "3.27.0"

[build-dependencies]
uniffi = { version = "0.31.2", features = ["build"] }

[profile.release]
lto = true
strip = "symbols"

[features]
napi_rs = ["dep:napi", "dep:napi-derive"]
uniffi = ["dep:uniffi"]
default = ["uniffi", "rustls-tls"]

# TLS backend options (choose one, rustls-tls is default for cross-compilation compatibility)
rustls-tls = []
native-tls = []
